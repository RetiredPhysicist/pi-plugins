<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="pi-noc-memory — SessionStart boot protocol + memory tools for Pi">
  <title>pi-noc-memory — Noc Memory extension for Pi</title>
  <desc>Session start automatically loads core memories and the daily briefing, then memory tools read and write your Noc Memory server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="700" fill="#f5f7fa">pi-noc-memory</text>
  <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" fill="#9aa7b8">Noc Memory extension for Pi</text>
  <rect x="64" y="150" width="200" height="6" rx="3" fill="url(#accent)"/>

  <!-- session start flow -->
  <rect x="64" y="186" width="230" height="88" rx="12" fill="#12202f" stroke="#24405c" stroke-width="2"/>
  <text x="86" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#e8f6ff">Session start</text>
  <text x="86" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#8fa9bd">auto-injected rules</text>

  <line x1="300" y1="230" x2="340" y2="230" stroke="#2a4a66" stroke-width="2"/>
  <polygon points="340,224 352,230 340,236" fill="#2a4a66"/>

  <rect x="358" y="186" width="230" height="88" rx="12" fill="#12202f" stroke="#24405c" stroke-width="2"/>
  <text x="380" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7dd3fc">noc_boot</text>
  <text x="380" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#8fa9bd">boot + briefing</text>

  <line x1="594" y1="230" x2="634" y2="230" stroke="#2a4a66" stroke-width="2"/>
  <polygon points="634,224 646,230 634,236" fill="#2a4a66"/>

  <rect x="652" y="186" width="230" height="88" rx="12" fill="#12202f" stroke="#24405c" stroke-width="2"/>
  <text x="674" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7dd3fc">noc://agent</text>
  <text x="674" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#8fa9bd">read / write / search</text>

  <!-- your server note -->
  <rect x="916" y="186" width="220" height="88" rx="12" fill="#12202f" stroke="#24405c" stroke-width="2"/>
  <text x="938" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">your MCP server</text>
  <text x="938" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#8fa9bd">memories stay yours</text>
</svg>
